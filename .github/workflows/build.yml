name: build
on: [ pull_request, push, workflow_dispatch ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Slint build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-slint-${{ hashFiles('CMakeLists.txt') }}

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ pkg-config libfontconfig1-dev libfreetype6-dev libxcb-xfixes0-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xkb-dev libxkbcommon-dev libssl-dev

      - name: Conf
        run: cmake -Bbuild -GNinja

      - name: Build
        run: cmake --build build


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Slint build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-slint-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -Bbuild -GNinja

      - name: Build
        run: cmake --build build 

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Slint build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-slint-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -Bbuild -GNinja

      - name: Build
        run: cmake --build build
